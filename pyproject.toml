[project]
name = "acoustic-freeform-lab"
version = "0.1.0"
description = "Private forward-model research for acoustically shaped optical interfaces"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "pyvista[jupyter]>=0.46,<0.49",
  "imageio>=2.36,<3",
  "imageio-ffmpeg>=0.6,<1",
  "jupyterlab>=4.3,<5",
  "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8",
  "scikit-fem>=12,<13",
  "flask>=3,<4",
]

[project.scripts]
afl = "acoustic_freeform.cli:main"
lenslab = "acoustic_freeform.single_interface.cli:main"

[project.optional-dependencies]
optimization = ["cvxpy>=1.6,<2"]

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acoustic_freeform"]

[tool.ruff]
line-length = 100
